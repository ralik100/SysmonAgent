services:
  client:
    build:
      context: ./
      dockerfile: Dockerfile

    image: ralik100/sysag:client_v1

    volumes:
      - ${SOCKET_PATH}:/socket/metrics.sock
      - ${DATA_PATH}:/output
      - ${CONFIG_FILE_PATH}:/src/config.json
    
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "client.py" ,"--config", "src/config.json"]
  postgres:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U sysmon -d sysmon"]
      retries: 5
      interval: 5s
      start_period: 30s

    environment:
      POSTGRES_DB: sysmon
      POSTGRES_USER: sysmon
      POSTGRES_PASSWORD: super_secret_password

    ports:
    - "5432:5432"