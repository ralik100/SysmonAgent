name: ci
run-name: ci
env:
  PYTHON_VERSION: '3.14.8'
on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:
    
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    
    - name: Copy Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Environment
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install deps
      run: python -m pip install -r requirements.txt

    - name: Prepare Unix Socket Path
      run: mkdir -p /tmp/socket
       
    - name: Start Server
      id: server
      background: true
      run: python src/server/main.py
    
    - name: Run Client Container Setup
      id: client
      background: true
      run: docker compose up --build

    - name: Stop server
      cancel: server

    - name: Stop client
      cancel: client
  
  test:
    runs-on: ubuntu-22.04
    needs: build
    steps:

    - name: Copy Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Environment
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install deps
      run: python -m pip install -r requirements.txt
    
    - name: Prepare Unix Socket Path
      run: mkdir -p /tmp/socket
       
    - name: Start Server
      id: server
      background: true
      run: python src/server/main.py
    
    - name: Run Client Container Setup
      id: client
      background: true
      run: docker compose up --build

    - name: Hardcoded wait for logs (for removal)
      shell: pwsh
      run: Start-Sleep -Seconds 20

    - name: Run Tests
      id: tests
      run: pytest -v > wynik.txt 2>&1
      timeout-minutes: 2
      continue-on-error: true

    - name: Stop server
      cancel: server

    - name: Stop client
      cancel: client

    - name: Generate test report
      run: |
      echo "# Test report:" >> "$GITHUB_STEP_SUMMARY"
      echo "" >> "$GITHUB_STEP_SUMMARY"
      echo '```text' >> "$GITHUB_STEP_SUMMARY"
      cat wynik.txt >> "$GITHUB_STEP_SUMMARY"
      echo '```'>> "$GITHUB_STEP_SUMMARY"
    
    - name: Set tests result
      if: steps.tests.outcome == 'failure'
      run: exit 1