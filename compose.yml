services:
  client:
    build:
      context: ./
      dockerfile: Dockerfile

    image: ralik100/sysag:client_v1

    volumes:
      - /tmp/metrics.sock:/tmp/metrics.sock
      - ./output:/output
    
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U sysmon -d sysmon"]
      retries: 5
      interval: 5s
      start_period: 30s

    environment:
      POSTGRES_DB: sysmon
      POSTGRES_USER: sysmon
      POSTGRES_PASSWORD: super_secret_password

    ports:
    - "5432:5432"